name: Sync ranking data and rebuild HTML

on:
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync and build
        run: |
          for attempt in 1 2 3; do
            if npm run sync; then exit 0; fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update ranking snapshot"
          git push
